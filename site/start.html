<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start a page · Mayfly</title>
<meta name="description" content="Answer a few quick questions to set up a one-page website. About five minutes; the link arrives by email.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{
  --paper:#F3F1EC;--card:#FBFAF7;--ink:#151412;--muted:#5E5A52;--line:#D9D5CC;--line-strong:#A9A397;
  --blue:#1F3FD1;--marker:#F2D64B;--err:#A3271B;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"URW Palladio L",P052,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#151412;--card:#1E1C19;--ink:#F3F1EC;--muted:#A9A397;--line:#34312C;
    --line-strong:#5A554D;--blue:#9DB0FF;--marker:#C9AE2C;--err:#FF8A7A}
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--blue);text-underline-offset:.2em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.col{width:100%;max-width:680px;margin:0 auto;padding:0 16px}

header{border-bottom:1px solid var(--line)}
header .col{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}
.brand{display:inline-flex;align-items:center;gap:9px;font:600 21px/1 var(--serif);color:var(--ink);text-decoration:none}
.brand svg{width:24px;height:24px}
header .alt{font-size:14px;color:var(--muted)}

.barwrap{position:sticky;top:0;background:var(--paper);z-index:5;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px}
.backlink{background:none;border:0;color:var(--muted);font:500 14px/1 var(--sans);padding:6px 2px}
.steplabel{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.track{height:3px;background:var(--line)}
.fill{height:100%;background:var(--blue);transition:width .25s}

.step{padding:30px 0 56px}
.q{font:600 clamp(26px,6.4vw,34px)/1.16 var(--serif);margin:0 0 16px}
.sub{color:var(--muted);margin:-8px 0 18px;font-size:15px}

.input{display:block;width:100%;min-height:52px;padding:13px 16px;border:1.5px solid var(--line-strong);
  border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px}
.input:focus{border-color:var(--ink)}
textarea.input{min-height:110px;resize:vertical}
.err{color:var(--err);font-size:14px;min-height:1.3em;margin:-4px 0 12px}

.continue{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;padding:12px 24px;
  border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font:600 16px/1 var(--sans);
  margin-top:6px}
.continue:disabled{opacity:.4}
.skiplink{display:block;margin:16px auto 0;background:none;border:0;color:var(--muted);text-decoration:underline;
  text-underline-offset:.2em;font-size:14px}

.cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.card{text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:16px;background:var(--card);color:var(--ink)}
.card.theme strong{display:block;font:600 18px/1.2 var(--serif);margin-bottom:4px}
.card.theme span{display:block;font-size:13.5px;line-height:1.35;color:var(--muted)}
.card.tier{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:0}
.card.tier strong{font:600 17px/1.2 var(--serif)}
.card.tier .amt{font:600 17px/1 var(--sans)}
.card.tier .taglabel{font-size:12px;color:var(--blue)}
@media (min-width:560px){.cardgrid.tiers{grid-template-columns:1fr 1fr 1fr}}

.toggle{border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer}
.toggle.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.toggle .title{display:flex;align-items:center;justify-content:space-between;font:600 17px/1.2 var(--serif)}
.toggle .check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none}
.toggle.on .check{background:var(--ink);border-color:var(--ink)}
.toggle ul{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:14px;line-height:1.5}

.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:9px 16px;border-radius:999px;border:1.5px solid var(--line-strong);background:transparent;color:var(--ink);font-size:14.5px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.addphoto{display:block;width:100%;margin-bottom:14px;padding:13px 18px;border-radius:12px;border:1.5px dashed var(--line-strong);
  background:transparent;color:var(--ink);font-weight:600}
.photolist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.pchip{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;max-width:160px;background:var(--card)}
.pchip .name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .cap{display:block;color:var(--muted);font-size:12px}
.pchip.bad .cap{color:var(--err)}

.summary{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;margin-bottom:20px}
.summary dt{color:var(--muted);font-size:13px;white-space:nowrap}
.summary dd{margin:0;font-size:15px;overflow-wrap:anywhere}
.total{font:600 22px/1.2 var(--serif);margin:0 0 18px}

.pay{display:block;text-align:center;min-height:50px;line-height:50px;border-radius:999px;background:var(--blue);
  color:#fff;text-decoration:none;font-weight:600;margin-bottom:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="col">
    <a class="brand" href="/" aria-label="Mayfly home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1F3FD1"/><path d="M7 6h18v12H7zM7 20h4v6H7zM12.5 20h4v6h-4zM18 20h4v6h-4z" fill="#F3F1EC"/></svg>
      Mayfly
    </a>
    <span class="alt">Prefer email? <a href="mailto:mayfly@agentmail.to">mayfly@agentmail.to</a></span>
  </div>
</header>

<div class="barwrap" id="barwrap">
  <div class="col bar">
    <button type="button" class="backlink" id="back">← Back</button>
    <span class="steplabel" id="steplabel"></span>
  </div>
  <div class="track"><div class="fill" id="fill" style="width:0%"></div></div>
</div>

<main class="col" id="screen"></main>

<script>
(function(){
  "use strict";

  var EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

  var THEMES = [
    { key: 'celebrate', name: 'Celebrate', desc: 'A birthday, anniversary, or party.' },
    { key: 'invite', name: 'Invite', desc: 'A wedding, shower, or event with RSVPs.' },
    { key: 'announce', name: 'Announce', desc: 'A new baby or other big news.' },
    { key: 'sell', name: 'Sell', desc: 'A yard sale or things you’re selling.' },
    { key: 'remember', name: 'Remember', desc: 'A memorial or service.' },
    { key: 'rally', name: 'Rally', desc: 'A cleanup, volunteer day, or meetup.' },
    { key: 'inform', name: 'Inform', desc: 'A lost pet or an important notice.' },
    { key: 'play', name: 'Play', desc: 'A game, scavenger hunt, or activity.' },
  ];

  var REQUIRED = {
    celebrate: ['occasion', 'datetime', 'location', 'host'],
    invite: ['event', 'datetime', 'venue', 'rsvp'],
    announce: ['subject', 'date', 'facts'],
    sell: ['items', 'location', 'contact'],
    remember: ['name', 'dates', 'service'],
    rally: ['cause', 'meetup', 'contact'],
    inform: ['subject', 'keyfacts', 'contact'],
    play: ['activity', 'when', 'howtojoin'],
  };

  var FIELD_META = {
    occasion: { q: 'What’s the occasion?', type: 'text', ph: 'A birthday, an anniversary…' },
    event: { q: 'What’s the event called?', type: 'text', ph: 'Maya & Sam’s wedding' },
    subject: { q: 'Who or what is the page about?', type: 'text' },
    datetime: { q: 'What’s the date and time?', type: 'datetime-local' },
    when: { q: 'When is it?', type: 'datetime-local' },
    date: { q: 'What date did it happen?', type: 'date' },
    location: { q: 'Where is it?', type: 'text', ph: 'An address works best' },
    venue: { q: 'Where is it?', type: 'text', ph: 'An address works best' },
    meetup: { q: 'Where and when should people meet?', type: 'text' },
    host: { q: 'Who’s hosting?', type: 'text' },
    contact: { q: 'What’s the best phone number or email for people to reach you?', type: 'text' },
    rsvp: { q: 'How should people RSVP, and by when?', type: 'text' },
    items: { q: 'What’s for sale, and roughly what does it cost?', type: 'textarea' },
    facts: { q: 'What are two or three things people should know?', type: 'textarea' },
    keyfacts: { q: 'What are the key facts people should know?', type: 'textarea' },
    name: { q: 'What’s their full name?', type: 'text' },
    dates: { q: 'What are the dates (born and died)?', type: 'text', ph: 'e.g. 1950 – 2026' },
    service: { q: 'When and where is the service?', type: 'text' },
    cause: { q: 'What’s the cause?', type: 'text' },
    activity: { q: 'What’s the game or activity?', type: 'text' },
    howtojoin: { q: 'How do people join in?', type: 'text' },
  };

  var TONES = ['Warm & friendly', 'Playful', 'Elegant', 'Simple & direct', 'Somber'];

  var TIERS = [
    { key: 'free', life: '1 day', price: 0, priceText: 'Free' },
    { key: 'twoday', life: '2 days', price: 1, priceText: '$1' },
    { key: 'week', life: '7 days', price: 1.5, priceText: '$1.50' },
    { key: 'month', life: '30 days', price: 5, priceText: '$5' },
    { key: 'year', life: '1 year', price: 50, priceText: '$50' },
  ];

  var PACK_FIRST = {
    celebrate: 'Printable QR poster', invite: 'Printable QR poster', play: 'Printable QR poster',
    rally: 'Printable QR poster', inform: 'Printable QR poster',
    sell: 'Printable QR yard sign',
    remember: 'Printable QR card for the service',
    announce: 'Printable QR announcement card',
  };

  var SID_KEY = 'mayfly_sid', DRAFT_KEY = 'mayfly_form_v1';

  function newId() { return crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12)); }
  var sid = '';
  try { sid = localStorage.getItem(SID_KEY) || ''; } catch (e) {}
  function ensureSession() {
    if (!sid) { sid = newId(); try { localStorage.setItem(SID_KEY, sid); } catch (e) {} }
    return sid;
  }

  function freshState() {
    return {
      step: 0, theme: '', fields: {}, fieldsRaw: {}, details: '',
      photos: '', uploadCount: 0, photoNames: [],
      toneChip: '', toneText: '', tone: '',
      email: '', eligibility: null, tier: '', pack: false, rush: false,
      submitted: false, result: null, rejectedMsg: '',
    };
  }
  var state = freshState();
  try {
    var raw = localStorage.getItem(DRAFT_KEY);
    if (raw) {
      var draft = JSON.parse(raw);
      if (draft && typeof draft === 'object') state = Object.assign(freshState(), draft);
    }
  } catch (e) {}

  function save() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); } catch (e) {} }
  function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

  function steps() {
    var list = [{ id: 'theme' }];
    if (state.theme && REQUIRED[state.theme]) {
      REQUIRED[state.theme].forEach(function (k) { list.push({ id: 'field', key: k }); });
    }
    list.push({ id: 'details' });
    list.push({ id: 'photos' });
    list.push({ id: 'tone' });
    list.push({ id: 'email' });
    list.push({ id: 'duration' });
    list.push({ id: 'addons' });
    list.push({ id: 'review' });
    return list;
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function post(path, body) {
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return { error: 'retry', message: 'That didn’t go through. Mind trying again?' }; }); });
  }

  function humanize(type, raw) {
    raw = String(raw || '');
    if (type === 'datetime-local' && raw) {
      var d = new Date(raw);
      if (!isNaN(d)) return d.toLocaleString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
    }
    if (type === 'date' && raw) {
      var d2 = new Date(raw + 'T00:00:00');
      if (!isNaN(d2)) return d2.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    }
    return raw.trim();
  }

  function themeName(key) {
    var t = THEMES.filter(function (x) { return x.key === key; })[0];
    return t ? t.name : key;
  }
  function tierOf(key) { return TIERS.filter(function (x) { return x.key === key; })[0] || null; }
  function tierLabel(key, elig) {
    var t = tierOf(key);
    if (!t) return key;
    if (elig && elig.free) return t.life + ' — Free';
    return t.life + ' — ' + t.priceText;
  }
  function computeTotal() {
    var base = (state.eligibility && state.eligibility.free) ? 0 : ((tierOf(state.tier) || {}).price || 0);
    var extras = (state.pack ? 5 : 0) + (state.rush ? 3 : 0);
    return base + extras;
  }
  function money(n) {
    if (n === 0) return 'Free';
    return '$' + n.toFixed(2).replace(/\.00$/, '');
  }

  // ---- Photo upload: shrink to 2000px, strip EXIF, re-encode as JPEG. ----
  function shrink(f) {
    var MAX = 2000;
    var load = window.createImageBitmap
      ? createImageBitmap(f, { imageOrientation: 'from-image' })
      : new Promise(function (res, rej) { var im = new Image(); im.onload = function () { res(im); }; im.onerror = rej; im.src = URL.createObjectURL(f); });
    return load.then(function (img) {
      var w = img.width, h = img.height, s = Math.min(1, MAX / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return new Promise(function (res) { c.toBlob(res, 'image/jpeg', 0.85); });
    });
  }
  function b64(blob) {
    return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1]); }; r.onerror = rej; r.readAsDataURL(blob); });
  }

  // ---- Screens ----

  function themeScreen() {
    var wrap = el('div', 'step');
    wrap.appendChild(el('h1', 'q', 'What’s the page for?'));
    var grid = el('div', 'cardgrid');
    THEMES.forEach(function (t) {
      var c = el('button', 'card theme'); c.type = 'button';
      var strong = el('strong', '', t.name), span = el('span', '', t.desc);
      c.appendChild(strong); c.appendChild(span);
      c.addEventListener('click', function () {
        if (state.theme !== t.key) { state.theme = t.key; state.fields = {}; state.fieldsRaw = {}; }
        goto(1);
      });
      grid.appendChild(c);
    });
    wrap.appendChild(grid);
    return wrap;
  }

  function fieldScreen(s) {
    var key = s.key, meta = FIELD_META[key] || { q: 'Tell me about “' + key + '”.', type: 'text' };
    var wrap = el('div', 'step');
    wrap.appendChild(el('h1', 'q', meta.q));
    var input;
    if (meta.type === 'textarea') { input = document.createElement('textarea'); input.rows = 3; }
    else { input = document.createElement('input'); input.type = meta.type || 'text'; }
    input.className = 'input';
    if (meta.ph) input.placeholder = meta.ph;
    input.value = state.fieldsRaw[key] || '';
    wrap.appendChild(input);
    var err = el('p', 'err'); wrap.appendChild(err);
    var btn = el('button', 'continue', 'Continue'); btn.type = 'button';
    wrap.appendChild(btn);
    function submit() {
      var v = input.value.trim();
      if (v.length < 2) { err.textContent = 'This can’t be empty.'; return; }
      state.fieldsRaw[key] = input.value;
      state.fields[key] = humanize(meta.type, input.value);
      goto(state.step + 1);
    }
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
    setTimeout(function () { input.focus(); }, 20);
    return wrap;
  }

  function detailsScreen() {
    var wrap = el('div', 'step');
    wrap.appendChild(el('h1', 'q', 'Anything else the page should say?'));
    wrap.appendChild(el('p', 'sub', 'Optional — a sentence or two is plenty.'));
    var ta = document.createElement('textarea'); ta.className = 'input'; ta.rows = 4; ta.value = state.details;
    wrap.appendChild(ta);
    var btn = el('button', 'continue', 'Continue'); btn.type = 'button';
    wrap.appendChild(btn);
    function submit() { state.details = ta.value.trim(); goto(state.step + 1); }
    btn.addEventListener('click', submit);
    ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
    setTimeout(function () { ta.focus(); }, 20);
    return wrap;
  }

  function photoChip(name, pending) {
    var d = el('div', 'pchip');
    d.appendChild(el('span', 'name', name));
    d.appendChild(el('span', 'cap', pending ? 'Uploading…' : 'Added'));
    return d;
  }

  function photosScreen() {
    var wrap = el('div', 'step');
    wrap.appendChild(el('h1', 'q', 'Add a few photos.'));
    wrap.appendChild(el('p', 'sub', state.pack
      ? 'Up to 12 photos are included with the Plus pack.'
      : 'The first 6 photos are included free. The Plus pack (at the end) raises that to 12.'));
    var list = el('div', 'photolist');
    (state.photoNames || []).forEach(function (n) { list.appendChild(photoChip(n)); });
    wrap.appendChild(list);

    var addBtn = el('button', 'addphoto', 'Add photos'); addBtn.type = 'button';
    var fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.accept = 'image/*'; fileInput.multiple = true; fileInput.style.display = 'none';
    addBtn.addEventListener('click', function () { fileInput.click(); });
    wrap.appendChild(addBtn); wrap.appendChild(fileInput);

    var err = el('p', 'err'); wrap.appendChild(err);
    var btn = el('button', 'continue', 'Continue'); btn.type = 'button';
    btn.disabled = !(state.uploadCount > 0);
    wrap.appendChild(btn);
    var skip = el('button', 'skiplink', 'No photos — continue'); skip.type = 'button';
    wrap.appendChild(skip);

    fileInput.addEventListener('change', function () {
      var room = 12 - state.uploadCount;
      var files = Array.prototype.slice.call(fileInput.files || []).slice(0, Math.max(0, room));
      fileInput.value = '';
      if (!files.length) return;
      ensureSession();
      var chain = Promise.resolve();
      files.forEach(function (f) {
        var chip = photoChip(f.name, true);
        list.appendChild(chip);
        chain = chain.then(function () {
          return shrink(f).then(function (blob) {
            if (!blob) throw new Error('decode');
            return b64(blob).then(function (data) {
              return post('/api/intake/upload', { sessionId: sid, name: (f.name || 'photo').replace(/\.\w+$/, '') + '.jpg', b64: data });
            });
          }).then(function (d) {
            if (d && d.ok) {
              state.uploadCount = d.count;
              state.photos = 'uploaded';
              state.photoNames = (state.photoNames || []).concat([f.name]);
              chip.querySelector('.cap').textContent = 'Added';
              btn.disabled = false;
              save();
            } else {
              chip.querySelector('.cap').textContent = (d && d.message) || 'Didn’t upload.';
              chip.classList.add('bad');
            }
          }).catch(function () {
            chip.querySelector('.cap').textContent = 'Couldn’t read that photo.';
            chip.classList.add('bad');
          });
        });
      });
    });

    btn.addEventListener('click', function () { goto(state.step + 1); });
    skip.addEventListener('click', function () { state.photos = 'none'; goto(state.step + 1); });
    return wrap;
  }

  function toneScreen() {
    var wrap = el('div', 'step');
    wrap.appendChild(el('h1', 'q', 'What tone fits?'));
    var row = el('div', 'chiprow');
    TONES.forEach(function (t) {
      var c = el('button', 'chip', t); c.type = 'button';
      if (state.toneChip === t) c.classList.add('on');
      c.addEventListener('click', function () {
        state.toneChip = state.toneChip === t ? '' : t;
        Array.prototype.forEach.call(row.children, function (ch) { ch.classList.toggle('on', ch.textContent === state.toneChip); });
      });
      row.appendChild(c);
    });
    wrap.appendChild(row);
    var extra = document.createElement('input');
    extra.type = 'text'; extra.className = 'input'; extra.placeholder = 'Anything else about the vibe? (optional)';
    extra.value = state.toneText;
    wrap.appendChild(extra);
    var err = el('p', 'err'); wrap.appendChild(err);
    var btn = el('button', 'continue', 'Continue'); btn.type = 'button';
    wrap.appendChild(btn);
    function submit() {
      state.toneText = extra.value.trim();
      if (!state.toneChip && !state.toneText) { err.textContent = 'Pick one, or describe it.'; return; }
      state.tone = [state.toneChip, state.toneText].filter(Boolean).join(' — ');
      goto(state.step + 1);
    }
    btn.addEventListener('click', submit);
    extra.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
    return wrap;
  }

  function emailScreen() {
    var wrap = el('div', 'step');
    wrap.appendChild(el('h1', 'q', 'What email should I send the link to?'));
    var input = document.createElement('input');
    input.type = 'email'; input.className = 'input'; input.placeholder = 'you@example.com'; input.value = state.email;
    wrap.appendChild(input);
    var err = el('p', 'err'); wrap.appendChild(err);
    var btn = el('button', 'continue', 'Continue'); btn.type = 'button';
    wrap.appendChild(btn);
    function submit() {
      var v = input.value.trim();
      if (!EMAIL_RE.test(v)) { err.textContent = 'That doesn’t look like an email address.'; return; }
      state.email = v;
      btn.disabled = true; btn.textContent = 'Checking…';
      post('/api/intake/eligibility', { email: v }).then(function (d) {
        state.eligibility = (d && d.ok) ? d : null;
      }).catch(function () {
        state.eligibility = null;
      }).then(function () {
        btn.disabled = false; btn.textContent = 'Continue';
        save();
        goto(state.step + 1);
      });
    }
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
    setTimeout(function () { input.focus(); }, 20);
    return wrap;
  }

  function durationScreen() {
    var wrap = el('div', 'step');
    wrap.appendChild(el('h1', 'q', 'How long should the page stay up?'));
    var grid = el('div', 'cardgrid tiers');
    var elig = state.eligibility;
    TIERS.forEach(function (t) {
      var c = el('button', 'card tier'); c.type = 'button';
      c.appendChild(el('strong', '', t.life));
      if (elig && elig.free) {
        c.appendChild(el('span', 'amt', 'Free'));
        c.appendChild(el('span', 'taglabel', elig.kind === 'starter' ? 'Starter page — free' : 'This month’s free page'));
      } else {
        c.appendChild(el('span', 'amt', t.priceText));
      }
      c.addEventListener('click', function () { state.tier = t.key; goto(state.step + 1); });
      grid.appendChild(c);
    });
    wrap.appendChild(grid);
    return wrap;
  }

  function toggleCard(title, bullets, on, setter) {
    var c = el('div', 'toggle' + (on ? ' on' : ''));
    var head = el('div', 'title');
    head.appendChild(el('span', '', title));
    head.appendChild(el('span', 'check'));
    c.appendChild(head);
    var ul = document.createElement('ul');
    bullets.forEach(function (b) { var li = document.createElement('li'); li.textContent = b; ul.appendChild(li); });
    c.appendChild(ul);
    c.addEventListener('click', function () {
      var v = !c.classList.contains('on');
      c.classList.toggle('on', v);
      setter(v);
      save();
    });
    return c;
  }

  function addonsScreen() {
    var wrap = el('div', 'step');
    wrap.appendChild(el('h1', 'q', 'Make it work harder.'));
    var packFirst = PACK_FIRST[state.theme] || 'Printable QR poster';
    wrap.appendChild(toggleCard('Plus pack — $5', [
      packFirst, 'No Mayfly badge on your page', 'Up to 12 photos', 'One free round of edits', 'Priority help',
    ], state.pack, function (v) { state.pack = v; }));
    wrap.appendChild(toggleCard('Rush — $3', [
      'Front of the line — your page is live in about 10 minutes.',
      'Standard build: link by email within 2 hours.',
    ], state.rush, function (v) { state.rush = v; }));
    var btn = el('button', 'continue', 'Continue'); btn.type = 'button';
    wrap.appendChild(btn);
    btn.addEventListener('click', function () { goto(state.step + 1); });
    return wrap;
  }

  function reviewScreen() {
    var wrap = el('div', 'step');
    wrap.appendChild(el('h1', 'q', 'Check it over.'));
    var list = document.createElement('dl'); list.className = 'summary';
    function row(label, value) {
      list.appendChild(el('dt', '', label));
      list.appendChild(el('dd', '', value));
    }
    row('Theme', themeName(state.theme));
    (REQUIRED[state.theme] || []).forEach(function (k) {
      var meta = FIELD_META[k];
      row(meta ? meta.q.replace(/[?:]$/, '') : k, state.fields[k] || '');
    });
    if (state.details) row('Details', state.details);
    row('Photos', state.photos === 'uploaded' ? (state.uploadCount + ' added') : 'None');
    row('Tone', state.tone || '—');
    row('Email', state.email);
    row('Duration', tierLabel(state.tier, state.eligibility));
    if (state.pack) row('Plus pack', '$5');
    if (state.rush) row('Rush', '$3');
    wrap.appendChild(list);

    wrap.appendChild(el('p', 'total', 'Total due: ' + money(computeTotal())));
    var err = el('p', 'err'); wrap.appendChild(err);
    var btn = el('button', 'continue', 'Submit'); btn.type = 'button';
    wrap.appendChild(btn);
    btn.addEventListener('click', function () { submitOrder(btn, err); });
    return wrap;
  }

  function submitOrder(btn, err) {
    btn.disabled = true; btn.textContent = 'Submitting…'; err.textContent = '';
    var payload = {
      sessionId: ensureSession(), theme: state.theme, fields: state.fields, details: state.details || '',
      tone: state.tone || '', tier: state.tier, email: state.email,
      photos: state.photos === 'uploaded' ? 'uploaded' : 'none',
      pack: !!state.pack, rush: !!state.rush,
    };
    post('/api/intake/submit', payload).then(function (d) {
      if (d && d.ok) { state.result = d; state.submitted = true; clearDraft(); render(); return; }
      if (d && d.rejected) { state.rejectedMsg = d.message || ''; state.submitted = 'rejected'; render(); return; }
      if (d && d.error === 'pack_required_for_photos') {
        err.textContent = d.message || 'More than 6 photos needs the Plus pack.';
        btn.disabled = false; btn.textContent = 'Submit';
        return;
      }
      if (d && d.error === 'incomplete') {
        err.textContent = 'A few answers still need to be filled in. Please check your steps and try again.';
        btn.disabled = false; btn.textContent = 'Submit';
        return;
      }
      err.textContent = (d && d.message) || 'That didn’t go through. Mind trying again?';
      btn.disabled = false; btn.textContent = 'Submit';
    }).catch(function () {
      err.textContent = 'Lost the connection for a second. Try again?';
      btn.disabled = false; btn.textContent = 'Submit';
    });
  }

  function linkAmountText(label) {
    if (/^\$/.test(label)) return 'Pay ' + label.split(' ')[0];
    if (label === 'Plus pack') return 'Pay $5 — Plus pack';
    if (label === 'Rush') return 'Pay $3 — Rush';
    if (label === 'Plus pack + Rush') return 'Pay $8 — Plus pack + Rush';
    return 'Pay — ' + label;
  }

  function resetAll() {
    try { localStorage.removeItem(SID_KEY); localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    sid = '';
    state = freshState();
    render();
  }

  function renderDone() {
    screen.innerHTML = '';
    var wrap = el('div', 'step');
    if (state.submitted === 'rejected') {
      wrap.appendChild(el('h1', 'q', 'We can’t build this page.'));
      wrap.appendChild(el('p', 'sub', state.rejectedMsg || 'If you have something else in mind, we’re happy to start over.'));
      var again1 = el('button', 'continue', 'Start over'); again1.type = 'button';
      again1.addEventListener('click', resetAll);
      wrap.appendChild(again1);
      screen.appendChild(wrap);
      return;
    }
    var d = state.result || {};
    wrap.appendChild(el('h1', 'q', d.amountDue > 0 ? 'One step left: payment.' : 'You’re in the build queue.'));
    if (d.amountDue > 0) {
      (d.paymentLinks || []).forEach(function (p) {
        var a = document.createElement('a'); a.className = 'pay'; a.href = p.url; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = linkAmountText(p.label);
        wrap.appendChild(a);
      });
      wrap.appendChild(el('p', 'sub', 'The page is built once payment lands.'));
    } else {
      wrap.appendChild(el('p', 'sub', 'No payment needed — it’s in the build queue now.'));
    }
    wrap.appendChild(el('p', 'sub', d.delivery === 'rush-10min'
      ? 'Live in about 10 minutes.'
      : 'Built and emailed within about 2 hours.'));
    wrap.appendChild(el('p', 'sub', 'The link arrives at ' + state.email + '.'));
    var again = el('button', 'continue', 'Make another page'); again.type = 'button';
    again.addEventListener('click', resetAll);
    wrap.appendChild(again);
    screen.appendChild(wrap);
  }

  var RENDERERS = {
    theme: themeScreen, field: fieldScreen, details: detailsScreen, photos: photosScreen,
    tone: toneScreen, email: emailScreen, duration: durationScreen, addons: addonsScreen, review: reviewScreen,
  };

  var screen = document.getElementById('screen'), barwrap = document.getElementById('barwrap');
  var backBtn = document.getElementById('back'), stepLabel = document.getElementById('steplabel'), fill = document.getElementById('fill');

  function goto(i) { state.step = i; render(); }
  backBtn.addEventListener('click', function () { if (state.step > 0) goto(state.step - 1); });

  function render() {
    if (state.submitted) { barwrap.style.display = 'none'; renderDone(); return; }
    barwrap.style.display = '';
    var list = steps();
    if (state.step >= list.length) state.step = list.length - 1;
    if (state.step < 0) state.step = 0;
    var s = list[state.step];
    stepLabel.textContent = 'Step ' + (state.step + 1) + ' of ' + list.length;
    fill.style.width = (list.length > 1 ? (state.step / (list.length - 1)) * 100 : 0) + '%';
    backBtn.style.visibility = state.step > 0 ? 'visible' : 'hidden';
    screen.innerHTML = '';
    screen.appendChild(RENDERERS[s.id](s));
    save();
  }

  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Start a page · Mayfly</title>
<meta name="description" content="Chat with Nova to set up a one-page website. About five minutes; the link arrives by email.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{
  --paper:#F3F1EC;--card:#FBFAF7;--ink:#151412;--muted:#5E5A52;--line:#D9D5CC;--line-strong:#A9A397;
  --blue:#1F3FD1;--marker:#F2D64B;--err:#A3271B;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"URW Palladio L",P052,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#151412;--card:#1E1C19;--ink:#F3F1EC;--muted:#A9A397;--line:#34312C;
    --line-strong:#5A554D;--blue:#9DB0FF;--marker:#C9AE2C;--err:#FF8A7A}
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100dvh}
a{color:var(--blue);text-underline-offset:.2em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.col{width:100%;max-width:680px;margin:0 auto;padding:0 16px}

header{border-bottom:1px solid var(--line);background:var(--paper)}
header .col{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}
.brand{display:inline-flex;align-items:center;gap:9px;font:600 21px/1 var(--serif);color:var(--ink);text-decoration:none}
.brand svg{width:24px;height:24px}
header .alt{font-size:14px;color:var(--muted)}

#log{flex:1;overflow-y:auto;overscroll-behavior:contain}
#log .col{display:flex;flex-direction:column;gap:12px;padding-top:22px;padding-bottom:18px}
.msg{max-width:86%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.nova{align-self:flex-start}
.msg.nova .who{display:block;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 2px}
.msg.nova .b{background:var(--card);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:11px 15px}
.msg.you{align-self:flex-end}
.msg.you .b{background:var(--ink);color:var(--paper);border-radius:16px 16px 4px 16px;padding:11px 15px}
.msg.you .b a{color:inherit}
.msg.note .b{background:transparent;border:1px dashed var(--line-strong);color:var(--muted);font-size:15px}
.msg.err .b{border-color:var(--err);color:var(--err)}
.msg img.thumb{display:block;width:150px;height:150px;object-fit:cover;border-radius:10px}
.msg.you.photo .b{padding:4px;background:transparent;border:1px solid var(--line)}
.msg .cap{display:block;font:500 12px/1.3 var(--mono);color:var(--muted);margin:6px 4px 2px}
.pay{display:inline-flex;align-items:center;min-height:46px;margin-top:10px;padding:10px 20px;border-radius:999px;
  background:var(--blue);color:#fff;text-decoration:none;font-weight:600}
.again{display:inline-flex;min-height:44px;margin-top:10px;padding:9px 18px;border-radius:999px;border:1.5px solid var(--ink);
  background:transparent;color:var(--ink);font-weight:600}
.dots{display:inline-flex;gap:5px;padding:5px 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.4;animation:d 1.1s infinite}
.dots i:nth-child(2){animation-delay:.16s}.dots i:nth-child(3){animation-delay:.32s}
@keyframes d{30%{opacity:1;transform:translateY(-3px)}}

#chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;max-width:680px;margin:0 auto;width:100%;scrollbar-width:none}
#chips:empty{display:none}
.chip{flex:none;min-height:40px;padding:8px 15px;border-radius:999px;border:1.5px solid var(--line-strong);background:transparent;
  color:var(--ink);font-size:15px;font-weight:500;white-space:nowrap}
.chip:active{background:var(--line)}

footer{border-top:1px solid var(--line);background:var(--paper);padding-bottom:env(safe-area-inset-bottom)}
form{display:flex;align-items:flex-end;gap:8px;padding-top:10px;padding-bottom:10px}
.ib{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--line-strong);background:transparent;color:var(--ink)}
.ib svg{width:21px;height:21px}
#send{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ib:disabled{opacity:.35;cursor:default}
#msg{flex:1;min-width:0;min-height:46px;max-height:140px;resize:none;border:1.5px solid var(--line-strong);border-radius:23px;
  padding:11px 17px;font:inherit;line-height:1.4;background:var(--card);color:var(--ink);outline:none}
#msg:focus{border-color:var(--ink)}
.hint{font:500 11px/1.4 var(--mono);color:var(--muted);text-align:center;padding:0 16px 10px;margin:0}
input[type=file]{display:none}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}
</style>
</head>
<body>
<header>
  <div class="col">
    <a class="brand" href="/" aria-label="Mayfly home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1F3FD1"/><path d="M7 6h18v12H7zM7 20h4v6H7zM12.5 20h4v6h-4zM18 20h4v6h-4z" fill="#F3F1EC"/></svg>
      Mayfly
    </a>
    <span class="alt">Prefer email? <a href="mailto:mayfly@agentmail.to">mayfly@agentmail.to</a></span>
  </div>
</header>

<div id="log" role="log" aria-live="polite"><div class="col" id="chat"></div></div>
<div id="chips"></div>

<footer>
  <form id="composer" class="col" autocomplete="off">
    <button type="button" class="ib" id="add" aria-label="Add photos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2.5"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8.5 5l1.5-2h4l1.5 2"/></svg>
    </button>
    <input type="file" id="file" accept="image/*" multiple>
    <label for="msg" style="position:absolute;left:-9999px">Message</label>
    <textarea id="msg" rows="1" maxlength="2000" placeholder="Type a message"></textarea>
    <button type="submit" class="ib" id="send" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
    </button>
  </form>
  <p class="hint">Up to 6 photos. They’re shrunk on your phone and location data is removed before upload.</p>
</footer>

<script>
(function(){
  "use strict";
  var chat = document.getElementById('chat'), log = document.getElementById('log');
  var chips = document.getElementById('chips'), form = document.getElementById('composer');
  var msg = document.getElementById('msg'), send = document.getElementById('send');
  var add = document.getElementById('add'), file = document.getElementById('file');
  var KEY = 'mayfly_sid', busy = false, closed = false, firstTurn = true;
  var tier = new URLSearchParams(location.search).get('tier') || '';

  function store(get, val){ try { return get ? localStorage.getItem(KEY) : localStorage.setItem(KEY, val); } catch (e) { return null; } }
  function newId(){ return crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12)); }
  var sid = store(true) || '';
  function fresh(){ sid = newId(); store(false, sid); firstTurn = true; closed = false; setEnabled(true); }

  function scroll(){ log.scrollTop = log.scrollHeight; }
  function linkify(el, text){
    var parts = String(text).split(/(https:\/\/[^\s<]+)/g);
    parts.forEach(function(p, i){
      if (i % 2) { var a = document.createElement('a'); a.href = p; a.target = '_blank'; a.rel = 'noopener'; a.textContent = p.replace(/\?.*$/, ''); el.appendChild(a); }
      else el.appendChild(document.createTextNode(p));
    });
  }
  function bubble(from, text, kind){
    var row = document.createElement('div');
    row.className = 'msg ' + from + (kind ? ' ' + kind : '');
    if (from === 'nova') { var w = document.createElement('span'); w.className = 'who'; w.textContent = 'Nova'; row.appendChild(w); }
    var b = document.createElement('div'); b.className = 'b';
    var pay = /https:\/\/buy\.stripe\.com\/[^\s]+/.exec(text || '');
    // The payment link renders as a button, not as a raw URL.
    if (pay) text = text.replace(pay[0], '').replace(/:\s*\n\s*\n/, '.\n\n').replace(/\n{3,}/g, '\n\n');
    if (from === 'nova') linkify(b, text); else b.textContent = text;
    row.appendChild(b);
    if (from === 'nova' && pay) {
      var a = document.createElement('a'); a.className = 'pay'; a.href = pay[0]; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Pay with card';
      b.appendChild(document.createElement('br')); b.appendChild(a);
    }
    chat.appendChild(row); scroll();
    return row;
  }
  function typing(on){
    var t = document.getElementById('typing');
    if (!on) { if (t) t.remove(); return; }
    if (t) return;
    var row = document.createElement('div'); row.className = 'msg nova'; row.id = 'typing';
    row.innerHTML = '<span class="who">Nova</span><div class="b"><span class="dots" aria-label="Nova is typing"><i></i><i></i><i></i></span></div>';
    chat.appendChild(row); scroll();
  }
  function setChips(list){
    chips.textContent = '';
    (list || []).forEach(function(c){
      var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = c;
      b.addEventListener('click', function(){ msg.value = c; form.requestSubmit(); });
      chips.appendChild(b);
    });
  }
  var OPENERS = ['A birthday party', 'A yard sale', 'A lost pet', 'A wedding', 'Something else'];
  var TIERS = ['1 day, free', '2 days, $1', '7 days, $1.50', '30 days, $5', '1 year, $50'];
  function chipsFor(reply){
    if (/how long|stay up|days?\b.*\bfree|\$1\.50|lifespan/i.test(reply)) setChips(TIERS); else setChips([]);
  }
  function setEnabled(on){ msg.disabled = !on; send.disabled = !on; add.disabled = !on; }
  function finished(){
    closed = true; setEnabled(false); setChips([]);
    var row = bubble('nova', 'Your order is in. Want to make another page?', 'note');
    var b = document.createElement('button'); b.type = 'button'; b.className = 'again'; b.textContent = 'Start a new page';
    b.addEventListener('click', function(){ row.remove(); fresh(); greet(); });
    row.querySelector('.b').appendChild(document.createElement('br'));
    row.querySelector('.b').appendChild(b);
    scroll();
  }

  function post(path, body){
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function(r){ return r.json().catch(function(){ return { error: 'retry', message: 'That didn’t go through. Mind trying again?' }; }); });
  }
  function postRetry(path, body){
    return post(path, body).catch(function(){
      return new Promise(function(res){ setTimeout(res, 1500); }).then(function(){ return post(path, body); });
    });
  }

  function greet(){
    typing(true);
    setTimeout(function(){
      typing(false);
      bubble('nova', 'Hi, I’m Nova. I’ll ask what the page is for, the details, a few photos, and how long it should stay up. Then we build it and email you the link, usually within a few hours.\n\nWhat’s the page for?');
      setChips(OPENERS); msg.focus();
    }, 400);
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var text = msg.value.trim();
    if (!text || busy || closed) return;
    if (!sid) fresh();
    busy = true; send.disabled = true;
    bubble('you', text); msg.value = ''; resize(); setChips([]); typing(true);
    var body = { sessionId: sid, message: text };
    if (firstTurn && tier) body.tier = tier;
    postRetry('/api/intake/chat', body).then(function(d){
      typing(false);
      if (d.error === 'session_closed') {
        fresh();
        bubble('nova', 'That conversation is closed, so let’s start a new one. What’s the page for?');
        setChips(OPENERS);
      } else if (d.error) {
        bubble('nova', d.message || 'That didn’t go through. Mind trying again?', 'err');
        msg.value = text; resize();
      } else {
        firstTurn = false;
        bubble('nova', d.reply || 'Got it.');
        if (d.done) finished();
        else if (d.rejected) { closed = true; setEnabled(false); var r = bubble('nova', '', 'note'); var b = document.createElement('button'); b.className = 'again'; b.type = 'button'; b.textContent = 'Start over'; b.addEventListener('click', function(){ r.remove(); fresh(); greet(); }); r.querySelector('.b').appendChild(b); }
        else chipsFor(d.reply || '');
      }
    }).catch(function(){
      typing(false);
      bubble('nova', 'Lost the connection for a second. Try sending that again?', 'err');
      msg.value = text; resize();
    }).then(function(){ busy = false; if (!closed) { send.disabled = false; msg.focus(); } });
  });

  msg.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  });
  function resize(){ msg.style.height = 'auto'; msg.style.height = Math.min(msg.scrollHeight + 3, 140) + 'px'; }
  msg.addEventListener('input', resize);

  // Photos: decode with EXIF rotation, shrink to 2000px, re-encode as JPEG.
  // Re-encoding drops EXIF, so GPS location never leaves the phone.
  function shrink(f){
    var MAX = 2000;
    var load = window.createImageBitmap
      ? createImageBitmap(f, { imageOrientation: 'from-image' })
      : new Promise(function(res, rej){ var im = new Image(); im.onload = function(){ res(im); }; im.onerror = rej; im.src = URL.createObjectURL(f); });
    return load.then(function(img){
      var w = img.width, h = img.height, s = Math.min(1, MAX / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return new Promise(function(res){ c.toBlob(res, 'image/jpeg', 0.85); });
    });
  }
  function b64(blob){
    return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(String(r.result).split(',')[1]); }; r.onerror = rej; r.readAsDataURL(blob); });
  }
  add.addEventListener('click', function(){ file.click(); });
  file.addEventListener('change', function(){
    var files = Array.prototype.slice.call(file.files || []).slice(0, 6);
    file.value = '';
    if (!files.length) return;
    if (!sid || firstTurn) { bubble('nova', 'Tell me what the page is for first, then add photos.', 'note'); return; }
    var chain = Promise.resolve();
    files.forEach(function(f){
      chain = chain.then(function(){
        var row = bubble('you', '', 'photo'); var b = row.querySelector('.b'); b.textContent = '';
        var img = document.createElement('img'); img.className = 'thumb'; img.alt = 'Your photo'; img.src = URL.createObjectURL(f);
        var cap = document.createElement('span'); cap.className = 'cap'; cap.textContent = 'Uploading…';
        b.appendChild(img); b.appendChild(cap); scroll();
        return shrink(f).then(function(blob){
          if (!blob) throw new Error('decode');
          return b64(blob).then(function(data){ return post('/api/intake/upload', { sessionId: sid, name: (f.name || 'photo').replace(/\.\w+$/, '') + '.jpg', b64: data }); });
        }).then(function(d){
          cap.textContent = d.ok ? 'Added (' + d.count + ' of ' + (d.max || 6) + ')' : (d.message || 'That photo didn’t upload.');
          if (!d.ok) { img.style.opacity = '.35'; cap.style.color = 'var(--err)'; }
        }).catch(function(){ cap.textContent = 'Couldn’t read that photo. Try a JPEG or PNG?'; img.style.opacity = '.35'; });
      });
    });
  });

  // Pick up where we left off after a reload.
  if (!sid) { greet(); return; }
  post('/api/intake/history', { sessionId: sid }).then(function(h){
    if (!h || h.status === 'new' || !h.messages || !h.messages.length || h.status === 'rejected') { if (h && h.status === 'rejected') fresh(); greet(); return; }
    firstTurn = false;
    h.messages.forEach(function(m){ bubble(m.from === 'nova' ? 'nova' : 'you', m.text); });
    if (h.uploads) bubble('nova', h.uploads + ' photo' + (h.uploads === 1 ? '' : 's') + ' added so far.', 'note');
    if (h.status === 'complete') finished(); else msg.focus();
  }).catch(greet);
})();
</script>
</body>
</html>

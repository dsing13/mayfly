:root{
  --paper:#FFD8BE;--card:#FFF7EA;--ink:#2A1840;--muted:#5A4A6E;--line:rgba(42,24,64,.16);--line-strong:#2A1840;
  --sun:#EE4B2B;--tomato-deep:#BE2E14;--err:#A3200C;
  --head:Fredoka,"Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--paper);transition:background-color .6s}
body{margin:0;background:transparent;color:var(--ink);font:400 17px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:clip}
a{color:inherit;text-underline-offset:.2em}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.col{width:100%;max-width:640px;margin:0 auto;padding:0 16px}

header .col{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px}
.brand{display:inline-flex;align-items:center;gap:9px;font:600 22px/1 var(--head);color:var(--ink);text-decoration:none}
.brand svg{width:25px;height:25px}
header .alt{font-size:14px}

/* progress */
.barwrap{position:sticky;top:0;z-index:5;padding-bottom:4px;background:var(--paper);transition:background-color .6s}
.bar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 0}
.backlink{background:none;border:0;font:600 15px/1 var(--head);padding:6px 2px}
.steplabel{font:600 14px/1 var(--head);color:var(--muted)}
.track{height:6px;margin:8px 0 6px;border-radius:3px;background:var(--line)}
.fill{height:100%;width:0;border-radius:3px;background:var(--ink);transition:width .35s}

.step{padding:22px 0 64px;animation:deal .32s cubic-bezier(.2,1.3,.5,1)}
@keyframes deal{from{opacity:0;transform:translateX(26px) rotate(1.2deg)}}
.q{font:600 clamp(32px,8vw,44px)/1.08 var(--head);margin:0 0 18px;text-wrap:balance}
.sub{margin:-8px 0 18px;font-size:16px;color:var(--muted)}

.input{display:block;width:100%;min-height:58px;padding:14px 16px;border:0;border-radius:6px;background:var(--card);color:var(--ink);
  font:inherit;font-size:18px;margin-bottom:12px;box-shadow:0 4px 0 var(--line);outline:none}
.input:focus{box-shadow:0 4px 0 var(--ink)}
textarea.input{min-height:120px;resize:vertical}
.err{color:var(--err);font-size:15px;font-weight:600;min-height:1.3em;margin:-4px 0 12px}
.err:not(:empty){animation:nudge .3s}
@keyframes nudge{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.continue{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;padding:12px 24px;border-radius:999px;border:0;
  background:var(--ink);color:var(--card);font:600 19px/1 var(--head);margin-top:6px;box-shadow:0 5px 0 var(--line);transition:transform .1s,box-shadow .1s}
.continue:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.continue:disabled{opacity:.4}
.skiplink{display:block;margin:18px auto 0;background:none;border:0;text-decoration:underline;text-underline-offset:.2em;font-size:15px}

.cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.card{text-align:left;border:0;padding:15px 14px 16px;background:var(--card);box-shadow:0 4px 0 var(--line);transform:rotate(var(--r,-.8deg));
  transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.card:nth-child(3n+2){--r:.9deg}.card:nth-child(3n){--r:-.3deg}
.card:hover{transform:rotate(0) translateY(-3px)}
.card:active{transform:scale(.97)}
.card.theme strong{display:block;font:600 21px/1.1 var(--head);margin-bottom:4px}
.card.theme span{display:block;font-size:14px;line-height:1.3;color:var(--muted)}
.card.tier{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.card.tier strong{font:600 21px/1.1 var(--head)}
.card.tier.picked{box-shadow:0 0 0 3px var(--ink)}
@media (min-width:560px){.cardgrid.tiers{grid-template-columns:1fr 1fr 1fr}}


.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:10px 17px;border-radius:999px;border:0;background:var(--card);box-shadow:0 3px 0 var(--line);font:600 16px/1.1 var(--head);transition:transform .12s}
.chip.on{background:var(--ink);color:var(--card);transform:rotate(-2deg) scale(1.05)}

.addphoto{display:block;width:100%;margin-bottom:14px;padding:22px 18px;border:2px dashed var(--ink);background:transparent;font:600 19px/1 var(--head)}
.photolist{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.pchip{background:var(--card);padding:8px 10px 9px;font-size:13px;max-width:150px;box-shadow:0 3px 0 var(--line);transform:rotate(-1.5deg)}
.pchip:nth-child(even){transform:rotate(1.2deg)}
.pchip .name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .cap{display:block;color:var(--muted);font-size:12px}
.pchip.bad .cap{color:var(--err)}

.summary{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0 0 20px;padding:16px;background:var(--card);box-shadow:0 4px 0 var(--line)}
.summary dt{color:var(--muted);font-size:13px;max-width:9em}
.summary dd{margin:0;font-size:15px;overflow-wrap:anywhere}


@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

    { key: 'invite', name: 'Invite', desc: 'A wedding, shower, or event with RSVPs.' },
    { key: 'announce', name: 'Announce', desc: 'A new baby or other big news.' },
    { key: 'sell', name: 'Sell', desc: 'A yard sale or things you’re selling.' },
    { key: 'remember', name: 'Remember', desc: 'A memorial or service.' },
    { key: 'rally', name: 'Rally', desc: 'A cleanup, volunteer day, or meetup.' },
    { key: 'inform', name: 'Inform', desc: 'A lost pet or an important notice.' },
    { key: 'play', name: 'Play', desc: 'A game, scavenger hunt, or activity.' },
  ];

  var REQUIRED = {
    celebrate: ['occasion', 'datetime', 'location', 'host', 'rsvpto'],
    invite: ['event', 'datetime', 'venue', 'rsvp'],
    announce: ['subject', 'date', 'facts'],
    sell: ['items', 'location', 'contact'],
    remember: ['name', 'dates', 'service'],
    rally: ['cause', 'meetup', 'contact'],
    inform: ['subject', 'keyfacts', 'contact'],
    play: ['activity', 'when', 'howtojoin'],
  };

  var FIELD_META = {
    occasion: { q: 'What’s the occasion?', type: 'text', ph: 'A birthday, an anniversary…' },
    event: { q: 'What’s the event called?', type: 'text', ph: 'Maya & Sam’s wedding' },
    subject: { q: 'Who or what is the page about?', type: 'text' },
    datetime: { q: 'What’s the date and time?', type: 'datetime-local' },
    when: { q: 'When is it?', type: 'datetime-local' },
    date: { q: 'What date did it happen?', type: 'date' },
    location: { q: 'Where is it?', type: 'text', ph: 'An address works best' },
    venue: { q: 'Where is it?', type: 'text', ph: 'An address works best' },
    meetup: { q: 'Where and when should people meet?', type: 'text' },
    host: { q: 'Who’s hosting?', type: 'text' },
    rsvpto: { q: 'Where should RSVPs go?', type: 'text', ph: 'A phone number or email' },
    contact: { q: 'What’s the best phone number or email for people to reach you?', type: 'text' },
    rsvp: { q: 'How should people RSVP, and by when?', type: 'text' },
    items: { q: 'What’s for sale, and roughly what does it cost?', type: 'textarea' },
    facts: { q: 'What are two or three things people should know?', type: 'textarea' },
    keyfacts: { q: 'What are the key facts people should know?', type: 'textarea' },
    name: { q: 'What’s their full name?', type: 'text' },
    dates: { q: 'What are the dates (born and died)?', type: 'text', ph: 'e.g. 1950 – 2026' },
    service: { q: 'When and where is the service?', type: 'text' },
    cause: { q: 'What’s the cause?', type: 'text' },
    activity: { q: 'What’s the game or activity?', type: 'text' },
    howtojoin: { q: 'How do people join in?', type: 'text' },
  };

  var TONES = ['Warm & friendly', 'Playful', 'Elegant', 'Simple & direct', 'Somber'];

  var TIERS = [
    { key: 'free', life: '1 day' },
    { key: 'twoday', life: '2 days' },
    { key: 'week', life: '7 days' },
    { key: 'month', life: '30 days' },
    { key: 'year', life: '1 year' },
  ];

  var SID_KEY = 'mayfly_sid', DRAFT_KEY = 'mayfly_form_v2';

  function newId() { return crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12)); }
  var sid = '';
  try { sid = localStorage.getItem(SID_KEY) || ''; } catch (e) {}
  function ensureSession() {
    if (!sid) { sid = newId(); try { localStorage.setItem(SID_KEY, sid); } catch (e) {} }
    return sid;
  }

  function freshState() {
    return {
      step: 0, theme: '', fields: {}, fieldsRaw: {}, details: '',
      photos: '', uploadCount: 0, photoNames: [],
      toneChip: '', toneText: '', tone: '',
      email: '', tier: '',
      submitted: false, result: null, rejectedMsg: '',
    };
  }
  var state = freshState();
  var tornTier = new URLSearchParams(location.search).get('tier') || '';
  try {
    var raw = localStorage.getItem(DRAFT_KEY);
    if (raw) {
      var draft = JSON.parse(raw);
      if (draft && typeof draft === 'object') state = Object.assign(freshState(), draft);
    }
  } catch (e) {}

  function save() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); } catch (e) {} }
  function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

  function steps() {
    var list = [{ id: 'theme' }];
    if (state.theme && REQUIRED[state.theme]) {
      REQUIRED[state.theme].forEach(function (k) { list.push({ id: 'field', key: k }); });
    }
    list.push({ id: 'details' });
    list.push({ id: 'photos' });
    list.push({ id: 'tone' });
    list.push({ id: 'email' });
    list.push({ id: 'duration' });
    list.push({ id: 'review' });
    return list;
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function post(path, body) {
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return { error: 'retry', message: 'That didn’t go through. Mind trying again?' }; }); });
  }

  function humanize(type, raw) {
    raw = String(raw || '');
    if (type === 'datetime-local' && raw) {
      var d = new Date(raw);
      if (!isNaN(d)) return d.toLocaleString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
    }
    if (type === 'date' && raw) {
      var d2 = new Date(raw + 'T00:00:00');
      if (!isNaN(d2)) return d2.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    }
    return raw.trim();
  }

  function themeName(key) {
    var t = THEMES.filter(function (x) { return x.key === key; })[0];
    return t ? t.name : key;
  }
  function tierOf(key) { return TIERS.filter(function (x) { return x.key === key; })[0] || null; }
  function tierLabel(key) {
    var t = tierOf(key);
    return t ? t.life : key;
  }

  // ---- Photo upload: shrink to 2000px, strip EXIF, re-encode as JPEG. ----
  function shrink(f) {
    var MAX = 2000;
    var load = window.createImageBitmap
      ? createImageBitmap(f, { imageOrientation: 'from-image' })
      : new Promise(function (res, rej) { var im = new Image(); im.onload = function () { res(im); }; im.onerror = rej; im.src = URL.createObjectURL(f); });
    return load.then(function (img) {
      var w = img.width, h = img.height, s = Math.min(1, MAX / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return new Promise(function (res) { c.toBlob(res, 'image/jpeg', 0.85); });
    });
  }
  function b64(blob) {
    return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1]); }; r.onerror = rej; r.readAsDataURL(blob); });
  }

  // ---- Screens ----

  function themeScreen() {
    var wrap = el('div', 'step');
    wrap.appendChild(el('h1', 'q', 'What’s the page for?'));
    var grid = el('div', 'cardgrid');
    THEMES.forEach(function (t) {
      var c = el('button', 'card theme'); c.type = 'button';
      var strong = el('strong', '', t.name), span = el('span', '', t.desc);
      c.appendChild(strong); c.appendChild(span);
      c.addEventListener('click', function () {
        if (state.theme !== t.key) { state.theme = t.key; state.fields = {}; state.fieldsRaw = {}; }
        goto(1);
      });
      grid.appendChild(c);
    });
    wrap.appendChild(grid);
    return wrap;
  }

  function fieldScreen(s) {
    var key = s.key, meta = FIELD_META[key] || { q: 'Tell me about “' + key + '”.', type: 'text' };
    var wrap = el('div', 'step');
    wrap.appendChild(el('h1', 'q', meta.q));
    var input;
    if (meta.type === 'textarea') { input = document.createElement('textarea'); input.rows = 3; }
    else { input = document.createElement('input'); input.type = meta.type || 'text'; }
    input.className = 'input';
    if (meta.ph) input.placeholder = meta.ph;
    input.value = state.fieldsRaw[key] || '';
    wrap.appendChild(input);
    var err = el('p', 'err'); wrap.appendChild(err);
    var btn = el('button', 'continue', 'Continue'); btn.type = 'button';
    wrap.appendChild(btn);
    function submit() {
      var v = input.value.trim();
      if (v.length < 2) { err.textContent = 'This can’t be empty.'; return; }
      state.fieldsRaw[key] = input.value;
      state.fields[key] = humanize(meta.type, input.value);
      goto(state.step + 1);
    }
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
    setTimeout(function () { input.focus(); }, 20);
    return wrap;
  }

  function detailsScreen() {
    var wrap = el('div', 'step');
    wrap.appendChild(el('h1', 'q', 'Anything else the page should say?'));
    wrap.appendChild(el('p', 'sub', 'Optional — a sentence or two is plenty.'));
    var ta = document.createElement('textarea'); ta.className = 'input'; ta.rows = 4; ta.value = state.details;
    wrap.appendChild(ta);
    var btn = el('button', 'continue', 'Continue'); btn.type = 'button';
    wrap.appendChild(btn);
    function submit() { state.details = ta.value.trim(); goto(state.step + 1); }
    btn.addEventListener('click', submit);
    ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
    setTimeout(function () { ta.focus(); }, 20);
    return wrap;
  }

  function photoChip(name, pending) {
    var d = el('div', 'pchip');
    d.appendChild(el('span', 'name', name));
    d.appendChild(el('span', 'cap', pending ? 'Uploading…' : 'Added'));
    return d;
  }

  function photosScreen() {
    var wrap = el('div', 'step');
    wrap.appendChild(el('h1', 'q', 'Add a few photos.'));
    wrap.appendChild(el('p', 'sub', 'Up to 12 photos.'));
    var list = el('div', 'photolist');
    (state.photoNames || []).forEach(function (n) { list.appendChild(photoChip(n)); });
    wrap.appendChild(list);

    var addBtn = el('button', 'addphoto', 'Add photos'); addBtn.type = 'button';
    var fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.accept = 'image/*'; fileInput.multiple = true; fileInput.style.display = 'none';
    addBtn.addEventListener('click', function () { fileInput.click(); });
    wrap.appendChild(addBtn); wrap.appendChild(fileInput);

    var err = el('p', 'err'); wrap.appendChild(err);
    var btn = el('button', 'continue', 'Continue'); btn.type = 'button';
    btn.disabled = !(state.uploadCount > 0);
    wrap.appendChild(btn);
    var skip = el('button', 'skiplink', 'No photos — continue'); skip.type = 'button';
    wrap.appendChild(skip);

    fileInput.addEventListener('change', function () {
      var room = 12 - state.uploadCount;
      var files = Array.prototype.slice.call(fileInput.files || []).slice(0, Math.max(0, room));
      fileInput.value = '';
      if (!files.length) return;
      ensureSession();
      var chain = Promise.resolve();
      files.forEach(function (f) {
        var chip = photoChip(f.name, true);
        list.appendChild(chip);
        chain = chain.then(function () {
          return shrink(f).then(function (blob) {
            if (!blob) throw new Error('decode');
            return b64(blob).then(function (data) {
              return post('/api/intake/upload', { sessionId: sid, name: (f.name || 'photo').replace(/\.\w+$/, '') + '.jpg', b64: data });
            });
          }).then(function (d) {
            if (d && d.ok) {
              state.uploadCount = d.count;
              state.photos = 'uploaded';
              state.photoNames = (state.photoNames || []).concat([f.name]);
              chip.querySelector('.cap').textContent = 'Added';
              btn.disabled = false;
              save();
            } else {
              chip.querySelector('.cap').textContent = (d && d.message) || 'Didn’t upload.';
              chip.classList.add('bad');
            }
          }).catch(function () {
            chip.querySelector('.cap').textContent = 'Couldn’t read that photo.';
            chip.classList.add('bad');
          });
        });
      });
    });

    btn.addEventListener('click', function () { goto(state.step + 1); });
    skip.addEventListener('click', function () { state.photos = 'none'; goto(state.step + 1); });
    return wrap;
  }

  function toneScreen() {
    var wrap = el('div', 'step');
    wrap.appendChild(el('h1', 'q', 'What tone fits?'));
    var row = el('div', 'chiprow');
    TONES.forEach(function (t) {
      var c = el('button', 'chip', t); c.type = 'button';
      if (state.toneChip === t) c.classList.add('on');
      c.addEventListener('click', function () {
        state.toneChip = state.toneChip === t ? '' : t;
        Array.prototype.forEach.call(row.children, function (ch) { ch.classList.toggle('on', ch.textContent === state.toneChip); });
      });
      row.appendChild(c);
    });
    wrap.appendChild(row);
    var extra = document.createElement('input');
    extra.type = 'text'; extra.className = 'input'; extra.placeholder = 'Anything else about the vibe? (optional)';
    extra.value = state.toneText;
    wrap.appendChild(extra);
    var err = el('p', 'err'); wrap.appendChild(err);
    var btn = el('button', 'continue', 'Continue'); btn.type = 'button';
    wrap.appendChild(btn);
    function submit() {
      state.toneText = extra.value.trim();
      if (!state.toneChip && !state.toneText) { err.textContent = 'Pick one, or describe it.'; return; }
      state.tone = [state.toneChip, state.toneText].filter(Boolean).join(' — ');
      goto(state.step + 1);
    }
    btn.addEventListener('click', submit);
    extra.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
    return wrap;
  }

  function emailScreen() {
    var wrap = el('div', 'step');
    wrap.appendChild(el('h1', 'q', 'What email should I send the link to?'));
    var input = document.createElement('input');
    input.type = 'email'; input.className = 'input'; input.placeholder = 'you@example.com'; input.value = state.email;
    wrap.appendChild(input);
    var err = el('p', 'err'); wrap.appendChild(err);
    var btn = el('button', 'continue', 'Continue'); btn.type = 'button';
    wrap.appendChild(btn);
    function submit() {
      var v = input.value.trim();
      if (!EMAIL_RE.test(v)) { err.textContent = 'That doesn’t look like an email address.'; return; }
      state.email = v;
      save();
      goto(state.step + 1);
    }
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
    setTimeout(function () { input.focus(); }, 20);
    return wrap;
  }

  function durationScreen() {
    var wrap = el('div', 'step');
    wrap.appendChild(el('h1', 'q', 'How long should the page stay up?'));
    wrap.appendChild(el('p', 'sub', 'Every length is free.'));
    var grid = el('div', 'cardgrid tiers');
    TIERS.forEach(function (t) {
      var c = el('button', 'card tier'); c.type = 'button';
      if (t.key === (state.tier || tornTier)) c.classList.add('picked');
      c.appendChild(el('strong', '', t.life));
      c.addEventListener('click', function () { state.tier = t.key; goto(state.step + 1); });
      grid.appendChild(c);
    });
    wrap.appendChild(grid);
    return wrap;
  }

  function reviewScreen() {
    var wrap = el('div', 'step');
    wrap.appendChild(el('h1', 'q', 'Check it over.'));
    var list = document.createElement('dl'); list.className = 'summary';
    function row(label, value) {
      list.appendChild(el('dt', '', label));
      list.appendChild(el('dd', '', value));
    }
    row('Theme', themeName(state.theme));
    (REQUIRED[state.theme] || []).forEach(function (k) {
      var meta = FIELD_META[k];
      row(meta ? meta.q.replace(/[?:]$/, '') : k, state.fields[k] || '');
    });
    if (state.details) row('Details', state.details);
    row('Photos', state.photos === 'uploaded' ? (state.uploadCount + ' added') : 'None');
    row('Tone', state.tone || '—');
    row('Email', state.email);
    row('Duration', tierLabel(state.tier));
    wrap.appendChild(list);

    var err = el('p', 'err'); wrap.appendChild(err);
    var btn = el('button', 'continue', 'Submit'); btn.type = 'button';
    wrap.appendChild(btn);
    btn.addEventListener('click', function () { submitOrder(btn, err); });
    return wrap;
  }

  function submitOrder(btn, err) {
    btn.disabled = true; btn.textContent = 'Submitting…'; err.textContent = '';
    var payload = {
      sessionId: ensureSession(), theme: state.theme, fields: state.fields, details: state.details || '',
      tone: state.tone || '', tier: state.tier, email: state.email,
      photos: state.photos === 'uploaded' ? 'uploaded' : 'none',
    };
    post('/api/intake/submit', payload).then(function (d) {
      if (d && d.ok) { state.result = d; state.submitted = true; clearDraft(); render(); return; }
      if (d && d.rejected) { state.rejectedMsg = d.message || ''; state.submitted = 'rejected'; render(); return; }
      if (d && d.error === 'incomplete') {
        err.textContent = 'A few answers still need to be filled in. Please check your steps and try again.';
        btn.disabled = false; btn.textContent = 'Submit';
        return;
      }
      err.textContent = (d && d.message) || 'That didn’t go through. Mind trying again?';
      btn.disabled = false; btn.textContent = 'Submit';
    }).catch(function () {
      err.textContent = 'Lost the connection for a second. Try again?';
      btn.disabled = false; btn.textContent = 'Submit';
    });
  }

  function resetAll() {
    try { localStorage.removeItem(SID_KEY); localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    sid = '';
    state = freshState();
    render();
  }

  function renderDone() {
    screen.innerHTML = '';
    var wrap = el('div', 'step');
    if (state.submitted === 'rejected') {
      wrap.appendChild(el('h1', 'q', 'We can’t build this page.'));
      wrap.appendChild(el('p', 'sub', state.rejectedMsg || 'If you have something else in mind, we’re happy to start over.'));
      var again1 = el('button', 'continue', 'Start over'); again1.type = 'button';
      again1.addEventListener('click', resetAll);
      wrap.appendChild(again1);
      screen.appendChild(wrap);
      return;
    }
    document.documentElement.style.backgroundColor = '#BDE7F3';
    wrap.appendChild(el('h1', 'q', 'Your page is on its way.'));
    wrap.appendChild(el('p', 'sub', 'Built and emailed within about 2 hours.'));
    wrap.appendChild(el('p', 'sub', 'The link arrives at ' + state.email + '.'));
    var again = el('button', 'continue', 'Make another page'); again.type = 'button';
    again.addEventListener('click', resetAll);
    wrap.appendChild(again);
    screen.appendChild(wrap);
  }

  var RENDERERS = {
    theme: themeScreen, field: fieldScreen, details: detailsScreen, photos: photosScreen,
    tone: toneScreen, email: emailScreen, duration: durationScreen, review: reviewScreen,
  };

  var screen = document.getElementById('screen'), barwrap = document.getElementById('barwrap');
  var backBtn = document.getElementById('back'), stepLabel = document.getElementById('steplabel');

  // The paper color shifts as you go.
  var SKIES = ['#FFD8BE', '#FFE0C4', '#BDE7F3', '#BDE7F3', '#FFE36E', '#FFE36E', '#FFCB6B', '#FFB25B'];
  var fill = document.getElementById('fill');
  function paintDay(f) {
    var color = SKIES[Math.round(f * (SKIES.length - 1))];
    document.documentElement.style.backgroundColor = color;
    barwrap.style.backgroundColor = color;
    fill.style.width = (f * 100) + '%';
  }

  function goto(i) { state.step = i; render(); }
  backBtn.addEventListener('click', function () { if (state.step > 0) goto(state.step - 1); });

  function render() {
    if (state.submitted) { barwrap.style.display = 'none'; renderDone(); return; }
    barwrap.style.display = '';
    var list = steps();
    if (state.step >= list.length) state.step = list.length - 1;
    if (state.step < 0) state.step = 0;
    var s = list[state.step];
    stepLabel.textContent = 'Step ' + (state.step + 1) + ' of ' + list.length;
    paintDay(list.length > 1 ? state.step / (list.length - 1) : 0);
    backBtn.style.visibility = state.step > 0 ? 'visible' : 'hidden';
    screen.innerHTML = '';
    screen.appendChild(RENDERERS[s.id](s));
    save();
  }

  render();
})();
</script>
</body>
</html>

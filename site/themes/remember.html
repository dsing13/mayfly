<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title|Eleanor Whitaker, 1938–2026}}</title>
<meta name="description" content="{{og_description}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{page_title}}">
<meta property="og:description" content="{{og_description}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:url" content="{{site_url}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FAF7F0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!--
  MAYFLY THEME: remember (memorials)
  vars.json keys. Keys ending in _html, plus title and subtitle, are HTML;
  everything else is escaped by build-site.py.
    title            h1; wrap one word in <em> for the accent
    subtitle         one line under the title
    cta_html         buttons: <a class="btn-glow" href="..">..</a> <a class="btn-ghost" href="..">..</a>
    hero_image       /_img/<sub>/photo-1.jpg (omit for no photo)
    event_iso        e.g. 2026-10-17T15:00:00-04:00: date line, time left, calendar file
    venue_text       address for the Directions button
    tribute_html     a few paragraphs about the person
    details_html     .kv-row rows (service, where, reception, flowers)
    gallery_html     <figure><img src=".." alt=".." loading="lazy"><figcaption>..</figcaption></figure>
    contact_html     closing note / contact block
  Format keys:
    tribute_html     paragraphs; the first takes a drop cap
    details_html     .kv-row rows; printed as a centered order of service
    cta_html         sits at the end of the page, after the service details
  Section labels have defaults; override with details_heading, photos_heading.
  build-site.py fills: page_title, og_description, og_image, site_url,
  expires_at_iso, expires_label, qr_svg.
-->
<style>
/* mayfly:shared v10 */
:root{
  --f-oldstyle:"Iowan Old Style","Palatino Linotype",Palatino,"URW Palladio L",P052,"Book Antiqua",Georgia,serif;
  --f-transitional:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --f-didone:Didot,"Bodoni 72","Bodoni MT","Noto Serif Display",P052,Georgia,serif;
  --f-grotesk:"Helvetica Neue",Helvetica,Arial,"Nimbus Sans","Liberation Sans",system-ui,sans-serif;
  --f-industrial:"DIN Condensed","DIN Alternate",Bahnschrift,"Franklin Gothic Medium","Arial Narrow","Nimbus Sans Narrow",system-ui,sans-serif;
  --f-rounded:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",Nunito,"Varela Round",system-ui,sans-serif;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--text);
  -webkit-font-smoothing:antialiased;overflow-x:clip}
img,svg{display:block;max-width:100%}
a{color:var(--accent);text-underline-offset:.2em;text-decoration-thickness:1px}
p{margin:0 0 .8em}p:last-child{margin-bottom:0}
h1,h2,h3{font-family:var(--display);font-weight:var(--display-weight,600);line-height:1.08;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}

/* expiry badge: a sun rises when the page is published and sets when it comes down */
.mf-badge{display:flex;align-items:center;justify-content:center;gap:9px;font:500 12px/1.35 var(--f-mono);letter-spacing:.03em;
  text-align:center;padding:8px 16px;background:var(--ink);color:var(--paper)}
.mf-badge.sky{color:#2A1840;font-weight:600;transition:background-color 1s}
.mf-badge svg{width:38px;height:19px;flex:none;overflow:visible}

/* hero: photo on top, words underneath */
.hero{background:var(--paper)}
.hero-photo{width:100%;aspect-ratio:var(--hero-ratio,4/3);max-height:74vh;object-fit:cover;background:var(--soft)}
.hero-text{max-width:680px;margin:0 auto;padding:30px 20px 4px}
.hero-title{font-size:clamp(40px,11vw,80px);letter-spacing:-.015em;overflow-wrap:anywhere}
.hero-title em{font-style:italic;color:var(--accent)}
.hero-sub{font-size:clamp(18px,4.8vw,22px);line-height:1.45;color:var(--muted);margin:14px 0 0;max-width:32em}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}

/* buttons (class names are part of the vars.json contract) */
.btn-glow,.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;
  padding:12px 22px;border-radius:var(--radius);font:600 16px/1.2 var(--text);text-decoration:none;
  border:1.5px solid var(--accent);transition:transform .08s}
.btn-glow{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn-glow:active,.btn-ghost:active,.chip:active,.btn-rsvp:active{transform:scale(.97)}
.btn-ghost svg,.chip svg{width:18px;height:18px;flex:none}

/* sections */
section{padding:34px 0}
.kicker{display:flex;align-items:center;gap:12px;margin:0 0 16px;font:600 12px/1.2 var(--label);
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kicker::after{content:"";flex:1;height:1px;background:var(--line)}
section:has(> .wrap > [data-fill]:empty){display:none}

/* key/value rows */
.kv-row{display:grid;grid-template-columns:6.75rem 1fr;gap:2px 16px;padding:13px 0;border-top:1px solid var(--line)}
.kv-row:last-child{border-bottom:1px solid var(--line)}
.kv-row>span:first-child{font:600 12px/1.6 var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}

/* gallery: the first photo spans the row when the count is odd */
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gallery figure{margin:0}
.gallery img{width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--soft);cursor:zoom-in;
  border-radius:calc(var(--radius) * .5)}
.gallery figure:first-child:nth-last-child(odd){grid-column:1/-1}
.gallery figure:first-child:nth-last-child(odd) img{aspect-ratio:3/2}
.gallery figcaption{font-size:14px;line-height:1.4;color:var(--muted);margin-top:7px}

/* when & where */
.evsec{padding:26px 0 6px}
.ev-date{font:var(--display-weight,600) clamp(22px,5.8vw,30px)/1.2 var(--display);margin:0}
.ev-left{margin:6px 0 0;color:var(--muted);font-size:16px}
.ev-left:empty{display:none}
.ev-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:var(--radius);
  border:1.5px solid var(--line-strong);color:var(--ink);background:transparent;text-decoration:none;
  font:600 15px/1.2 var(--text);transition:transform .08s}

/* RSVP */
.rsvp-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-rsvp{display:flex;align-items:center;justify-content:center;min-height:54px;padding:12px;border-radius:var(--radius);
  font:600 17px/1.2 var(--text);text-decoration:none;text-align:center;transition:transform .08s}
.btn-rsvp.yes{background:var(--accent);color:var(--accent-ink)}
.btn-rsvp.no{border:1.5px solid var(--line-strong);color:var(--ink)}

/* contact + QR */
.contact{padding:22px 22px 24px;border:1.5px solid var(--ink);border-radius:var(--radius)}
.contact h2{font-size:26px;margin:0 0 8px}
.qr{display:flex;align-items:center;gap:16px;margin:22px 0 0}
.qr:has(.qr-box:empty){display:none}
.qr-box svg{width:112px;height:112px;background:#fff;padding:8px;border-radius:6px;border:1px solid var(--line)}
.qr p{font-size:14px;color:var(--muted);max-width:14em;margin:0}

/* accordion (native details) */
details.acc{border-top:1px solid var(--line)}
details.acc:last-of-type{border-bottom:1px solid var(--line)}
details.acc summary{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;
  padding:12px 0;font-weight:600;cursor:pointer;list-style:none}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font:400 22px/1 var(--f-ui);color:var(--muted)}
details.acc[open] summary::after{content:"\2212"}
details.acc .ab{padding:0 0 16px;color:var(--muted)}

/* footer: a perforated tear line, like the bottom of a paper flyer */
.mf-foot{margin-top:24px;padding:22px 20px 40px;text-align:center;border-top:2px dashed var(--line)}
.mf-foot p{font:500 12px/1.4 var(--f-mono);letter-spacing:.03em;color:var(--muted);margin:0}
.mf-foot a{color:inherit}
/* paper confetti on a yes */
.mf-bit{position:fixed;z-index:90;width:var(--bit-w,9px);height:var(--bit-h,14px);border-radius:var(--bit-r,0);clip-path:var(--bit-clip,none);pointer-events:none;animation:mf-bit var(--bit-t,1.2s) cubic-bezier(.2,.6,.5,1) forwards}
@keyframes mf-bit{to{transform:translate(var(--x),var(--y)) rotate(var(--a));opacity:0}}

/* photo viewer */
.lb{position:fixed;inset:0;z-index:100;background:rgba(10,10,10,.94);display:none;align-items:center;justify-content:center;touch-action:pan-y}
.lb.open{display:flex}
.lb img{max-width:94vw;max-height:84vh;object-fit:contain}
.lb-c{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#eee;font-size:14px;padding:0 20px}
.lb button{position:absolute;width:48px;height:48px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;
  display:flex;align-items:center;justify-content:center}
.lb button svg{width:22px;height:22px}
.lb-x{top:12px;right:12px}.lb-p{left:10px;top:50%;margin-top:-24px}.lb-n{right:10px;top:50%;margin-top:-24px}

/* title letters animate on themes with data-party */
.hero-title .wd{display:inline-block;white-space:nowrap}
.hero-title .ch{display:inline-block}
[data-party=pop] .hero-title .ch{animation:mf-pop .55s cubic-bezier(.3,1.7,.5,1) both}
@keyframes mf-pop{from{transform:translateY(.5em) scale(.4) rotate(-12deg);opacity:0}}
[data-party=rise] .hero-title .ch{animation:mf-rise .9s ease-out both}
@keyframes mf-rise{from{transform:translateY(.25em);opacity:0}}
[data-party=stamp] .hero-title{animation:mf-stamp .4s cubic-bezier(.3,1.4,.6,1)}
@keyframes mf-stamp{from{transform:scale(1.5) rotate(-3deg)}}
.edge{position:absolute;left:0;right:0;bottom:calc(100% - 1px);width:100%;height:26px;display:block}

@media (min-width:760px){
  section{padding:44px 0}
  .hero-text{padding-top:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* /mayfly:shared */
/* a printed service program: cameo portrait, the story, the order of service. Nothing moves. */
:root{--paper:#FAF7F0;--ink:#2B2A27;--muted:#6C6960;--line:#E3DED2;--line-strong:#B8B3A7;--soft:#EFEDE7;
  --accent:#4D483D;--accent-ink:#FAF7F0;--display:var(--f-oldstyle);--display-weight:400;--text:var(--f-oldstyle);
  --label:var(--f-oldstyle);--radius:2px}
body{font-size:18px;line-height:1.7}
.mf-badge{background:transparent;color:var(--muted);font-weight:400}
.program{max-width:600px;margin:12px auto 0;padding:0 12px}
.hero{padding:44px 12px 0;text-align:center;border:1px solid var(--line-strong);border-bottom:0;outline:1px solid var(--line);outline-offset:-6px}
.hero-photo{width:min(62%,250px);aspect-ratio:4/5;max-height:none;margin:0 auto;border-radius:50%;filter:saturate(.85)}
.hero-text{padding:28px 14px 34px;text-align:center}
.hero-title{font-size:clamp(36px,9.5vw,54px);line-height:1.14;letter-spacing:0}
.hero-title em{font-style:normal;color:inherit}
.hero-sub{margin:12px auto 0;font-size:18px;line-height:1.5;font-style:italic}
.dot{width:5px;height:5px;margin:0 auto;border-radius:50%;background:var(--muted)}
.tributesec{padding:34px 0 30px}
.tribute{font-size:19px;line-height:1.8;max-width:34em;margin:0 auto}
.tribute p{margin-bottom:1.1em}
.tribute p:first-child::first-letter{float:left;font-size:3.5em;line-height:.86;padding:.07em .09em 0 0}
.kicker{justify-content:center;font:400 16px/1.2 var(--f-oldstyle);font-variant:small-caps;text-transform:lowercase;letter-spacing:.14em;margin-bottom:20px}
.kicker::after{display:none}
.order{text-align:center}
.order .kv-row{display:block;padding:0 0 18px;border:0}
.order .kv-row>span{display:block}
.order .kv-row>span:first-child{font:italic 400 16px/1.5 var(--f-oldstyle);letter-spacing:0;text-transform:none;color:var(--muted);padding:0}
.order .kv-row>span:last-child{font-size:20px;line-height:1.4}
.evsec{padding:0 0 30px;text-align:center}
.ev-date{display:none}
.ev-actions{justify-content:center}
.btn-glow,.btn-ghost,.chip{font:500 15px/1.2 var(--f-ui);background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.gallery{grid-template-columns:1fr}
.gallery figure:first-child:nth-last-child(odd) img,.gallery img{aspect-ratio:3/2;filter:saturate(.85);border-radius:0}
.gallery figcaption{text-align:center;font-style:italic}
.contact{border:0;text-align:center;padding:0 8px;font-size:19px}
.contact h2{font-weight:400}
.cta-row{justify-content:center}
.qr{justify-content:center}
.mf-foot{border-top:0}
</style>
</head>
<body data-quiet>
<div class="mf-badge" id="expiry" data-expires="{{expires_at_iso}}" data-born="{{born_at_iso}}">{{expires_label|This page comes down in 7 days}}</div>

<div class="program">
<header class="hero">
  <img class="hero-photo" src="{{hero_image}}" alt="" fetchpriority="high">
  <div class="hero-text">
    <h1 class="hero-title">{{title}}</h1>
    <p class="hero-sub">{{subtitle}}</p>
  </div>
</header>
<div class="dot"></div>

<main>
<section class="tributesec">
  <div class="wrap">
    <div class="tribute" data-fill>{{tribute_html}}</div>
  </div>
</section>
<div class="dot"></div>
<section id="details">
  <div class="wrap">
    <h2 class="kicker">{{details_heading|Order of service}}</h2>
    <div class="order" data-fill>{{details_html}}</div>
  </div>
</section>
<div class="evsec" hidden>
  <div data-event="{{event_iso}}" data-mode="date"><p class="ev-date" data-evdate></p></div>
  <div class="ev-actions">
    <a class="chip" data-cal hidden>Add to calendar</a>
      <a class="chip" data-dir data-venue="{{venue_text}}" hidden>Directions</a>
  </div>
</div>
<section id="photos">
  <div class="wrap">
    <div class="gallery" data-fill>{{gallery_html}}</div>
  </div>
</section>
<section class="contactsec">
  <div class="wrap">
    <div class="contact" data-fill>{{contact_html}}</div>
    <div class="cta-row">{{cta_html}}<button type="button" class="btn-ghost" data-share>Share</button></div>
    <figure class="qr"><div class="qr-box">{{qr_svg}}</div><p>Scan with a phone camera to open this page.</p></figure>
  </div>
</section>
</main>
</div>

<footer class="mf-foot">
  <p>Made with <a href="https://trymayfly.com">Mayfly</a></p>
</footer>

<script>
/* mayfly:widgets v10 */
(function(){
"use strict";
function $(s,r){return (r||document).querySelector(s);}
function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
var ICON={
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M5 12.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-6.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>'
};
function icon(el,name){el.insertAdjacentHTML('afterbegin',ICON[name]);}
function plural(n,w){return n+' '+w+(n===1?'':'s');}
function until(ms){
  var d=Math.floor(ms/86400000),h=Math.floor(ms/3600000),m=Math.max(1,Math.round(ms/60000));
  return d>=1?plural(d,'day'):h>=1?plural(h,'hour'):plural(m,'minute');
}

/* hero photo: drop it cleanly when there isn't one */
$all('img.hero-photo').forEach(function(im){
  function drop(){im.remove();}
  if(!im.getAttribute('src')) drop(); else im.addEventListener('error',drop);
});

/* quiet pages (memorials, lost pets) get the plain badge and no play */
var quiet=document.body.hasAttribute('data-quiet');
var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* expiry badge: the sun's path spans the page's whole lifespan, however long that is */
(function(){
  var el=$('#expiry'); if(!el) return;
  var t=Date.parse(el.getAttribute('data-expires')||'');
  if(isNaN(t)) return;
  var born=Date.parse(el.getAttribute('data-born')||'');
  var arc=!quiet&&!isNaN(born)&&t>born, orb=null;
  var txt=document.createElement('span');
  el.textContent='';
  if(arc){
    el.insertAdjacentHTML('afterbegin','<svg viewBox="0 0 38 19" aria-hidden="true"><path d="M1 18Q19-16 37 18" fill="none" stroke="#2A1840" stroke-opacity=".45" stroke-width="1.6" stroke-dasharray="1 3.5" stroke-linecap="round"/><circle r="4" fill="#EE4B2B"/></svg>');
    orb=$('circle',el);
    el.classList.add('sky');
  }
  el.appendChild(txt);
  var SKY=[[255,216,190],[189,231,243],[255,227,110],[255,178,91],[196,164,236]];
  function tick(){
    var ms=t-Date.now();
    if(ms<=0){txt.textContent='This page has expired';return;}
    txt.textContent='This page comes down in '+until(ms);
    if(!arc) return;
    var f=Math.min(1,Math.max(0,(Date.now()-born)/(t-born)));
    orb.setAttribute('cx',(1+36*f).toFixed(2));
    orb.setAttribute('cy',(18-34*2*f*(1-f)).toFixed(2));
    var p=f*(SKY.length-1), i=Math.min(SKY.length-2,Math.floor(p)), k=p-i;
    el.style.backgroundColor='rgb('+SKY[i].map(function(c,j){return Math.round(c+(SKY[i+1][j]-c)*k);}).join(',')+')';
  }
  tick(); setInterval(tick,60000);
})();

/* paper confetti when someone says yes */
function confetti(from){
  if(quiet||still) return;
  var r=from.getBoundingClientRect(), css=getComputedStyle(document.documentElement);
  var cols=(css.getPropertyValue('--bits')||'').split(',').map(function(c){return c.trim();}).filter(Boolean);
  if(!cols.length) cols=[css.getPropertyValue('--accent'),'#FFD400','#FFF7EA','#BDE7F3'];
  for(var i=0;i<26;i++){
    var d=document.createElement('i');d.className='mf-bit';
    d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+r.height/2)+'px';
    d.style.background=cols[i%cols.length];
    d.style.setProperty('--x',(Math.random()*320-160)+'px');
    d.style.setProperty('--y',(Math.random()*-260+60)+'px');
    d.style.setProperty('--a',(Math.random()*720-360)+'deg');
    document.body.appendChild(d);
    setTimeout(d.remove.bind(d),2400);
  }
}

/* party pages: the title's letters pop in, and confetti greets you */
(function(){
  var party=document.body.getAttribute('data-party'); if(!party) return;
  if(party==='stamp'){ // scoreboard numbers add up to the headcount, and count up
    var cells=$all('.standings .row:not(.head) .rc').filter(function(e){return /^\d+$/.test(e.textContent.trim());});
    var total=cells.reduce(function(n,e){return n+parseInt(e.textContent,10);},0);
    var tally=$('[data-tally]');
    if(tally&&total){$('strong',tally).textContent=total;tally.hidden=false;cells=cells.concat($('strong',tally));}
    if(!still) cells.forEach(function(e){
      var end=parseInt(e.textContent,10), t0=null;e.textContent='0';
      requestAnimationFrame(function step(ts){t0=t0||ts;var f=Math.min(1,(ts-t0)/1100);
        e.textContent=Math.round(end*(1-Math.pow(1-f,3)));if(f<1)requestAnimationFrame(step);});
    });
  }
  var pop=$('[data-pop]'); if(pop) pop.addEventListener('click',function(){confetti(pop);});
  var title=$('.hero-title'); if(!title) return;
  title.setAttribute('aria-label',title.textContent);
  var n=0;
  (function walk(node){
    Array.prototype.slice.call(node.childNodes).forEach(function(c){
      if(c.nodeType!==3){walk(c);return;}
      var f=document.createDocumentFragment();
      c.textContent.split(/(\s+)/).forEach(function(w){
        if(!w.trim()){f.appendChild(document.createTextNode(w));return;}
        var wd=document.createElement('span');wd.className='wd';wd.setAttribute('aria-hidden','true');
        Array.from(w).forEach(function(ch){
          var s=document.createElement('span');s.className='ch';s.textContent=ch;s.style.animationDelay=(n++*45)+'ms';wd.appendChild(s);
        });
        f.appendChild(wd);
      });
      node.replaceChild(f,c);
    });
  })(title);
  // Long words shrink to fit the screen.
  function fit(){
    title.style.fontSize='';
    var room=title.clientWidth, wide=Math.max.apply(null,$all('.wd',title).map(function(w){return w.offsetWidth;}));
    if(wide>room) title.style.fontSize=(parseFloat(getComputedStyle(title).fontSize)*room/wide*.97)+'px';
  }
  fit(); addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
  if(party!=='stamp') setTimeout(function(){confetti(title);},n*45+250);
})();

/* when & where: date line, time left, calendar file, directions */
(function(){
  var sec=$('.evsec'); if(!sec) return;
  var ev=$('[data-event]',sec), raw=ev?(ev.getAttribute('data-event')||'').trim():'';
  var t=Date.parse(raw);
  var dir=$('[data-dir]',sec), venue=dir?(dir.getAttribute('data-venue')||'').trim():'';
  var cal=$('[data-cal]',sec);
  if(!isNaN(t)){
    sec.hidden=false;
    // Show the wall-clock time as written (the event's own UTC offset),
    // not converted to the viewer's time zone.
    var m=/([+-])(\d\d):?(\d\d)$/.exec(raw), off=m?(m[1]==='-'?-1:1)*(+m[2]*60+ +m[3]):(/z$/i.test(raw)?0:null);
    var shown=new Date(off===null?t:t+off*60000), tz=off===null?undefined:'UTC';
    var date=shown.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',timeZone:tz});
    if(/T\d\d:\d\d/.test(raw)){
      date+=' at '+shown.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:tz}).replace(':00','');
    }
    var dl=$('[data-evdate]',sec); if(dl) dl.textContent=date;
    // Calendar sheet (celebrate theme)
    var part=function(sel,o){var e=$(sel,sec);if(e)e.textContent=shown.toLocaleString('en-US',Object.assign({timeZone:tz},o));};
    part('[data-cal-dow]',{weekday:'short'});part('[data-cal-day]',{day:'numeric'});part('[data-cal-mon]',{month:'long'});
    if(/T\d\d:\d\d/.test(raw)) part('[data-cal-time]',{hour:'numeric',minute:'2-digit'});
    var left=$('[data-evleft]',sec);
    // Permanent examples (no expiry date) keep their sample dates; don't call them past.
    var badge=$('#expiry'), example=badge&&!badge.getAttribute('data-expires');
    if(left&&ev.getAttribute('data-mode')!=='date'&&!(example&&t<Date.now())){
      (function tick(){
        var ms=t-Date.now();
        left.textContent=ms>0?'In '+until(ms):ms>-3*3600000?'Happening now':'This has already happened.';
        if(ms>-3*3600000) setTimeout(tick,60000);
      })();
    }
    if(cal&&t>Date.now()-3600000){
      var f=function(d){return d.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');};
      var esc=function(s){return s.replace(/([,;\\])/g,'\\$1').replace(/[\r\n]+/g,' ');};
      var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mayfly//EN','BEGIN:VEVENT',
        'UID:'+t+'-'+Math.random().toString(36).slice(2)+'@trymayfly.com','DTSTAMP:'+f(new Date()),
        'DTSTART:'+f(new Date(t)),'DTEND:'+f(new Date(t+2*3600000)),
        'SUMMARY:'+esc(document.title),venue?'LOCATION:'+esc(venue):'',
        'URL:'+location.href.split('#')[0],'END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
      cal.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
      cal.setAttribute('download',(document.title||'event').replace(/[^\w -]+/g,'').trim().slice(0,40)+'.ics');
      icon(cal,'cal'); cal.hidden=false;
    }
  }
  if(venue&&dir){
    dir.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(venue);
    dir.target='_blank'; dir.rel='noopener';
    icon(dir,'pin'); dir.hidden=false; sec.hidden=false;
  }
})();

/* tear-off number tabs along the bottom of a flyer */
(function(){
  var box=$('[data-tabs]'); if(!box) return;
  var a=$('a[href^="tel:"],a[href^="sms:"]'); if(!a) return;
  var d=a.getAttribute('href').replace(/^\w+:/,'').replace(/[?&].*$/,'').replace(/[^\d]/g,'').replace(/^1(?=\d{10}$)/,'');
  var num=d.length===10?d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6):d;
  for(var i=0;i<8;i++){
    var t=document.createElement('a');t.className='tab';t.href=a.getAttribute('href');t.textContent=num;
    t.addEventListener('click',function(){this.classList.add('torn');});
    box.appendChild(t);
  }
  box.parentNode.hidden=false;
})();

/* RSVP buttons: prefilled email or text message */
(function(){
  var sec=$('.rsvpsec'); if(!sec) return;
  var btns=$all('[data-rsvp]',sec);
  var c=btns.length?(btns[0].getAttribute('data-rsvp')||'').trim():'';
  if(!c) return;
  sec.hidden=false;
  var isMail=c.indexOf('@')>-1, digits=c.replace(/[^+\d]/g,'');
  var ios=/iPhone|iPad|Mac/.test(navigator.userAgent);
  btns.forEach(function(b){
    var yes=b.getAttribute('data-answer')==='yes';
    var subj=(yes?'RSVP yes: ':'RSVP no: ')+document.title;
    var body=yes?'Count me in.':'Sorry, I can\u2019t make it.';
    if(yes) b.addEventListener('click',function(){confetti(b);});
    b.href=isMail?'mailto:'+c+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body)
      :'sms:'+digits+(ios?'&':'?')+'body='+encodeURIComponent(subj+'. '+body);
  });
})();

/* share */
$all('[data-share]').forEach(function(b){
  if(!navigator.share&&!(navigator.clipboard&&navigator.clipboard.writeText)){b.remove();return;}
  icon(b,'share');
  var label=b.lastChild;
  b.addEventListener('click',function(){
    var url=location.href.split('#')[0];
    if(navigator.share){navigator.share({title:document.title,url:url}).catch(function(){});return;}
    navigator.clipboard.writeText(url).then(function(){
      var old=label.textContent; label.textContent='Link copied';
      setTimeout(function(){label.textContent=old;},1800);
    });
  });
});

/* yes/no buttons on the play theme */
(function(){
  var v=$('[data-verdict]'), a=$('[data-verdict-answer]');
  var txt=a?(a.getAttribute('data-verdict-answer')||'').trim():'';
  if(!v||!txt) return;
  v.hidden=false;
  var yes=$('.yes',v), no=$('.no',v);
  if(yes) yes.addEventListener('click',function(){confetti(yes);a.textContent=txt;a.hidden=false;yes.setAttribute('aria-pressed','true');});
  if(no){
    var flee=function(){no.textContent='Try the other button';
      no.style.transform='translate('+(Math.random()*90-60)+'px,'+(Math.random()*70-35)+'px) rotate('+(Math.random()*24-12)+'deg)';};
    no.style.transition='transform .18s';
    no.addEventListener('pointerenter',flee);no.addEventListener('click',flee);
  }
})();

/* photo viewer */
(function(){
  var imgs=$all('img.hero-photo,.gallery img').filter(function(im){return im.getAttribute('src');});
  if(!imgs.length) return;
  var items=imgs.map(function(im){
    var fig=im.closest('figure'), fc=fig&&fig.querySelector('figcaption');
    return {src:im.currentSrc||im.src,cap:fc?fc.textContent:(im.alt||'')};
  });
  var lb=document.createElement('div');
  lb.className='lb'; lb.setAttribute('role','dialog'); lb.setAttribute('aria-modal','true'); lb.setAttribute('aria-label','Photos');
  lb.innerHTML='<button class="lb-x" aria-label="Close">'+ICON.x+'</button>'+
    (items.length>1?'<button class="lb-p" aria-label="Previous photo">'+ICON.prev+'</button><button class="lb-n" aria-label="Next photo">'+ICON.next+'</button>':'')+
    '<img alt=""><p class="lb-c"></p>';
  document.body.appendChild(lb);
  var big=$('img',lb), cap=$('.lb-c',lb), ix=0, opener=null;
  function show(i){ix=(i+items.length)%items.length;big.src=items[ix].src;cap.textContent=items[ix].cap||'';}
  function open(i){opener=document.activeElement;show(i);lb.classList.add('open');document.body.style.overflow='hidden';$('.lb-x',lb).focus();}
  function close(){lb.classList.remove('open');document.body.style.overflow='';if(opener&&opener.focus)opener.focus();}
  $('.lb-x',lb).addEventListener('click',close);
  if(items.length>1){
    $('.lb-p',lb).addEventListener('click',function(){show(ix-1);});
    $('.lb-n',lb).addEventListener('click',function(){show(ix+1);});
  }
  lb.addEventListener('click',function(e){if(e.target===lb)close();});
  document.addEventListener('keydown',function(e){
    if(!lb.classList.contains('open'))return;
    if(e.key==='Escape')close(); else if(e.key==='ArrowLeft')show(ix-1); else if(e.key==='ArrowRight')show(ix+1);
  });
  var x0=0;
  lb.addEventListener('touchstart',function(e){x0=e.changedTouches[0].clientX;},{passive:true});
  lb.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-x0;if(dx>40)show(ix-1);else if(dx<-40)show(ix+1);},{passive:true});
  imgs.forEach(function(im,i){
    im.setAttribute('tabindex','0'); im.setAttribute('role','button');
    im.addEventListener('click',function(){open(i);});
    im.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open(i);}});
  });
})();
})();
</script>
